# @see Configuration schema/metadata at https://drupal.org/node/1905070
#
field.scbd_field_thesaurus.value:
  type: sequence
  label: 'Default value'
  sequence:
    type: mapping
    label: 'Default'
    mapping:
      value:
        type: string
        label: 'Value'

scbd_field.settings:
  type: config_object
  label: 'SCBD Field settings'
  mapping:
    debug:
      type: boolean
      label: 'Debug mode'
    disable_auto_gbf17:
      type: boolean
      label: 'Disable auto-add GBF Target 17'
    disable_auto_countries:
      type: boolean
      label: 'Disable auto-add countries'
    domain_order:
      type: sequence
      label: 'Domain display order'
      sequence:
        type: string
        label: 'Domain ID'

