# @see Configuration schema/metadata at https://drupal.org/node/1905070
#
field.scbd_field_thesaurus.value:
  type: sequence
  label: 'Default value'
  sequence:
    type: mapping
    label: 'Default'
    mapping:
      value:
        type: string
        label: 'Value'

scbd_field.settings:
  type: config_object
  label: 'SCBD Field settings'
  mapping:
    countries:
      type: sequence
      label: 'Countries'
      sequence:
        type: string
        label: 'Country code'
    translation:
      type: mapping
      label: 'Translation settings'
      mapping:
        auto_create:
          type: boolean
          label: 'Automatically create translations'
        use_all_languages:
          type: boolean
          label: 'Use all available languages'
        target_languages:
          type: sequence
          label: 'Target languages for auto-translation'
          sequence:
            type: string
            label: 'Language code'
        copy_source_values:
          type: boolean
          label: 'Copy source field values to translations'
        entity_types:
          type: sequence
          label: 'Entity types to auto-translate'
          sequence:
            type: string
            label: 'Entity type'

