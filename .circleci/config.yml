# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

orbs:
  node: circleci/node@5.2.0

jobs:
  php-lint:
    docker:
      - image: cimg/php:8.3-node
    steps:
      - checkout
      - run:
          name: Install composer (for phpcs)
          command: composer install --no-interaction --prefer-dist
      - run:
          name: PHP_CodeSniffer
          command: composer run lint:php
  php-tests:
    docker:
      - image: cimg/php:8.3-node
    steps:
      - checkout
      - run:
          name: Install composer dependencies (no dev optimized false)
          command: |
            composer install --no-interaction --prefer-dist
      - run:
          name: Run PHPUnit
          command: |
            composer test
  js-tests:
    docker:
      - image: cimg/node:24.1
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
            - v1-npm-deps-
      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
            - v1-npm-deps-
      - run:
          name: Install Node dependencies
          command: |
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - save_cache:
          key: v1-npm-deps-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run Jest tests
          command: npm test -- --ci --runInBand
  js-lint:
    docker:
      - image: cimg/node:24.1
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
            - v1-npm-deps-
      - run:
          name: Install Node dependencies
          command: |
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run:
          name: ESLint
          command: npm run lint:js

workflows:
  build-and-test:
    jobs:
      - php-lint
      - js-lint
      - php-tests:
          requires:
            - php-lint
      - js-tests:
          requires:
            - js-lint