# Provides a simple user interface that tells the developer where to go.
scbd_field.description:
  path: '/'
  defaults:
    _controller: '\Drupal\scbd_field\Controller\ScbdFieldController::description'
  requirements:
    _permission: 'access content'

# Configuration form for SCBD Field settings.
scbd_field.settings:
  path: '/admin/config/content/scbd-field'
  defaults:
    _form: '\Drupal\scbd_field\Form\ScbdFieldSettingsForm'
    _title: 'SCBD Field Settings'
  requirements:
    _permission: 'administer site configuration'
